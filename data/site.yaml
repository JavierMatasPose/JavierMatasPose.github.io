        I'm a Telecommunications Engineer living in Madrid. Currently working as a forward deployed
        AI engineer at [BCG X](https://www.bcg.com/x).

        I build systems and tools aiming to make life easier.

        Since my student days, I've loved AI, speceially RL and Generative.
        For my Master's thesis, I built a DRL trading agent that learns by mistakes.
        It traded live through brokerage APIs.  

        In my own time, I code, paint and practice BJJ.
        Of course I use agents for repetitive tasks, but I keep to myself the ideation and problem solving.

