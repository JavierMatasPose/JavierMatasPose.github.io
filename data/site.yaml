  sections:
    - text: |
        I'm a telecommunications engineer living in Madrid, Spain. I'm currently
        a forward deployed AI engineer at [BCG X](https://www.bcg.com/x).

        I build agents and the tools around them.

        I've loved AI since university, especially reinforcement learning and
        generative models. For my Master's thesis, I built a trading agent that
        learns from its own mistakes. It traded live through brokerage APIs.

        Outside work I code, paint and train Brazilian jiu-jitsu. I'm a blue belt
        at Lotus BJJ in Madrid.

        I use agents for the repetitive work. The ideas and the problem solving
        I keep for myself.

